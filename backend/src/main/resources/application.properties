spring.application.name=crypto-dashboard

server.port=8080

# H2 (embedded, file-based so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/cryptodashboard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console, available at /h2-console while the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CoinGecko public API base URL
coingecko.api.base-url=https://api.coingecko.com/api/v3

# Allowed origin for the frontend dev server (Vite)
app.cors.allowed-origin=http://localhost:5173
